name: CD

# Se dispara cuando el workflow "CI" (ci.yml) termina, y solo continua si termino en
# verde sobre un push a "develop" o "main" del propio repositorio (el modelo de ramas
# del equipo: "develop" es la rama de trabajo y se despliega a staging; "main" solo
# recibe merges al momento de liberar y se despliega a produccion). No repite las
# pruebas de CI -- confia en su resultado -- y por eso hace checkout del commit exacto
# que CI valido (github.event.workflow_run.head_sha), no de la rama a secas.
#
# Flujo:
#   develop: gate -> build-images (:staging, :sha-xxx) -> deploy-backend (EC2)
#   main:    gate -> build-images (:sha-xxx) -> release (vX.Y.Z, solo si el build funciono)
#            -> retag-release (:vX.Y.Z, :latest, sobre la MISMA imagen ya publicada,
#            sin reconstruir) -> deploy-backend (espera aprobacion del environment
#            "production"); en paralelo back-merge main -> develop
#
# El orden build-antes-de-release es deliberado: si "release" corriera primero y la
# construccion de la imagen fallara despues (como paso en la practica: "Cannot infer
# ref from detached HEAD"), el tag/GitHub Release ya habria quedado publicado sin
# ninguna imagen que lo respalde. Construir primero garantiza que un tag semantico
# nunca exista sin su imagen correspondiente en GHCR.
#
# El frontend NO se despliega desde aqui: Cloudflare Pages tiene su propia integracion de
# Git (build y deploy nativos por rama, con previews automaticos por PR) -- ver README
# "Setup de CD" para su configuracion. Reimplementar eso con wrangler en Actions solo
# duplicaria lo que Cloudflare ya hace, y peor (sin sus previews automaticas).
#
# CAVEAT de GitHub Actions: "workflow_run" solo empieza a dispararse una vez que el
# workflow escuchado (CI) ya existe en la rama por defecto del repo. La primera vez
# que este archivo se mezcle a main, CD no correra retroactivamente para ese push;
# corre normal desde el siguiente.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

# Una cola por rama: staging y produccion no se bloquean entre si, pero dos despliegues
# del mismo entorno nunca corren a la vez (ni se cancelan a mitad de camino).
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # Unico punto donde se decide si CD corre y hacia que entorno. Exigir event == push y
  # que el repo de origen sea este mismo evita que un PR desde un fork, con una rama
  # llamada "main" o "develop", dispare un release/despliegue con codigo ajeno (en ese
  # caso workflow_run.head_branch tambien vale "main").
  #
  # TEMPORAL: solo "main". No existe todavia infraestructura de staging (ni el rol IAM
  # OIDC ni la EC2), asi que build-images/deploy-backend en cada push a develop no
  # aportaba nada -- solo generaba imagenes :sha-xxx/:staging que nadie despliega (ver
  # cleanup-ghcr.yml, agregado justamente por esa acumulacion). Para reactivar develop
  # cuando exista esa infraestructura, agregar de nuevo
  # "|| github.event.workflow_run.head_branch == 'develop'" a la condicion de abajo.
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      environment: ${{ steps.ctx.outputs.environment }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha_tag: ${{ steps.ctx.outputs.sha_tag }}
    steps:
      - id: ctx
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "branch=$BRANCH"
            if [ "$BRANCH" = "main" ]; then echo "environment=production"; else echo "environment=staging"; fi
            echo "sha=$SHA"
            echo "sha_tag=sha-${SHA::7}"
          } >> "$GITHUB_OUTPUT"

  # Calcula la version semantica a partir del historial de commits con
  # semantic-release (Conventional Commits: "feat:" -> minor, resto -> patch,
  # "!:"/"BREAKING CHANGE:" -> major), genera CHANGELOG.md, taguea el repositorio
  # y crea la release de GitHub con notas. Solo en main, y solo si build-images ya
  # confirmo que la imagen de este commit construye bien (ver comentario de flujo
  # arriba): nunca se crea un tag/release sin imagen que lo respalde.
  # Configuracion en ".releaserc.json" y dependencias en el "package.json" de la raiz.
  release:
    needs: [gate, build-images]
    if: needs.gate.outputs.branch == 'main' && needs.build-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el tag, el commit del changelog y la release
      issues: write # comentar en issues referenciados por los commits liberados
      pull-requests: write # comentar en PRs referenciados por los commits liberados
    outputs:
      released: ${{ steps.read_version.outputs.released }}
      version: ${{ steps.read_version.outputs.version }}
      version_tag: ${{ steps.read_version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          # RELEASE_TOKEN (PAT de un admin del repo) en vez del GITHUB_TOKEN por defecto:
          # el commit "chore(release)" que deja @semantic-release/git se empuja directo a
          # main, y el ruleset de proteccion exige 2 checks ya en verde sobre ese commit
          # exacto -- imposible en un push directo. GITHUB_TOKEN actua como el usuario-bot
          # "github-actions[bot]" (verificado via GET rulesets/rule-suites: actor_id
          # 41898282, no la app/integracion 15368), que no tiene rol de colaborador y no
          # califica para ningun bypass del ruleset. Un PAT de un admin real si califica
          # (bypass_actors: RepositoryRole=admin), y no ata la excepcion a una persona en
          # particular: cualquier admin del repo que regenere este secreto sigue pasando.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: pnpm exec semantic-release
      - name: Leer version publicada
        id: read_version
        run: |
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            TAG=$(git describe --tags --exact-match HEAD)
            {
              echo "released=true"
              echo "version_tag=$TAG"
              echo "version=${TAG#v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # semantic-release deja en main un commit "chore(release): X.Y.Z [skip ci]" con el
  # CHANGELOG.md; sin este paso develop diverge de main en cada release y el siguiente
  # merge develop -> main arrastra conflictos en CHANGELOG.md. A diferencia de ese commit
  # (su "[skip ci]" evita que retrigger CI en main con cualquier token), este merge commit
  # no lo tiene: al pushearlo con RELEASE_TOKEN (un PAT real, no GITHUB_TOKEN) si dispara
  # CI -> CD sobre develop, lo cual esta bien -- valida y despliega a staging el contenido
  # que main ya libero. Si el merge no es limpio, el job falla y hay que resolverlo a mano.
  back-merge:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # mismo motivo que en el job "release": el push directo a develop necesita un admin real para pasar el ruleset
      - name: Merge main -> develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin develop

  # Construye y publica ambas imagenes en el Container Registry del propio repositorio
  # (ghcr.io/<owner>/ruta-backend y ruta-frontend) con su tag inmutable :sha-xxxxxxx
  # SIEMPRE (main y develop), mas :staging en develop. Corre antes que "release" a
  # proposito (ver comentario de flujo arriba): si esto falla, "release" ni siquiera
  # se intenta, asi que nunca queda un tag/GitHub Release de main sin imagen. Los tags
  # semanticos (:vX.Y.Z, :latest) se agregan despues, en "retag-release", sobre esta
  # misma imagen ya publicada -- no hace falta reconstruir para eso.
  # El tag que se despliega es siempre uno inmutable (vX.Y.Z en produccion,
  # sha-xxxxxxx en staging), nunca latest/staging, para que el rollback tenga a que volver.
  # La imagen del frontend solo se usa en el escenario B (todo en la VM); en el
  # escenario A el frontend se publica en Cloudflare Pages, con la integracion nativa
  # de Git de Cloudflare (no con esta imagen ni con este workflow).
  # cache-from type=gha con el mismo scope que uso el job "Build image" de ci.yml
  # para este mismo commit: si nada cambio en el Dockerfile/dependencias, este build
  # reutiliza esas capas en vez de reconstruir desde cero.
  # Requiere que el repositorio permita a GITHUB_TOKEN escribir paquetes
  # (Settings -> Actions -> General -> Workflow permissions -> Read and write).
  build-images:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # Checkout de un SHA exacto deja el HEAD "detached" (sin rama); docker/metadata-action
      # con context: git necesita resolver un ref simbolico y falla con "Cannot infer ref
      # from detached HEAD" si no lo tiene. Todos nuestros tags son type=raw con valores ya
      # explicitos (no dependen de este ref), asi que basta una rama local descartable.
      - run: git checkout -B cd-meta-ref
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # "git": toma el commit del checkout (head_sha). Con el contexto por defecto
          # ("workflow"), en un workflow_run el sha es el HEAD de la rama por defecto,
          # no el commit que CI valido, y el label/tag sha-xxx apuntaria a otro commit.
          context: git
          images: ghcr.io/${{ github.repository_owner }}/ruta-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=staging,enable=${{ needs.gate.outputs.branch == 'develop' }}
            type=raw,value=${{ needs.gate.outputs.sha_tag }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Le agrega los tags semanticos (:vX.Y.Z, :X.Y.Z, :latest) a la MISMA imagen que
  # build-images ya publico con :sha-xxxxxxx -- "docker buildx imagetools create" solo
  # copia manifiestos en el registro, no reconstruye nada. Como "release" ya exigio que
  # build-images tuviera exito antes de taguear en Git, y este job exige que "release"
  # efectivamente haya liberado una version, la imagen :vX.Y.Z SIEMPRE existe si el
  # tag de Git existe -- nunca puede quedar un release sin su imagen.
  retag-release:
    needs: [gate, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Agregar tags semanticos a las imagenes ya publicadas
        env:
          VERSION_TAG: ${{ needs.release.outputs.version_tag }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA_TAG: ${{ needs.gate.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for image in backend frontend; do
            repo="ghcr.io/${{ github.repository_owner }}/ruta-$image"
            docker buildx imagetools create \
              --tag "$repo:$VERSION_TAG" \
              --tag "$repo:$VERSION" \
              --tag "$repo:latest" \
              "$repo:$SHA_TAG"
          done

  # Despliega el backend en la EC2 del entorno via AWS SSM Run Command, autenticado con
  # OIDC (sin llaves de larga vida en GitHub y sin puerto 22 abierto). En la instancia
  # corre deploy/scripts/deploy.sh: pull, backup, up --wait, verificacion y rollback
  # automatico al ultimo tag bueno si algo falla. Los secretos de la app viven solo en
  # la VM (deploy/env/<entorno>.env), nunca pasan por GitHub.
  # El environment "production" debe tener "Required reviewers" (Settings ->
  # Environments) para que el despliegue a produccion espere una aprobacion manual.
  # Variables por environment: AWS_REGION, AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID y,
  # opcional, DEPLOY_DIR (por defecto /opt/ruta). Ver README -> "Setup de CD".
  deploy-backend:
    needs: [gate, release, build-images, retag-release]
    if: >-
      !cancelled() && needs.build-images.result == 'success' &&
      (needs.gate.outputs.branch == 'develop' ||
        (needs.release.outputs.released == 'true' && needs.retag-release.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.gate.outputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC -> rol de AWS
    env:
      DEPLOY_ENV: ${{ needs.gate.outputs.environment }}
      DEPLOY_TAG: ${{ needs.gate.outputs.branch == 'main' && needs.release.outputs.version_tag || needs.gate.outputs.sha_tag }}
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ruta' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      # Sin esto, un environment sin AWS_REGION/AWS_DEPLOY_ROLE_ARN/EC2_INSTANCE_ID
      # configuradas (p. ej. "production" antes de tener la infraestructura real) hace
      # que "configure-aws-credentials" falle con un rol vacio y el job entero se marque
      # en rojo -- un fallo que no aporta nada, porque ya se sabe de antemano que no hay
      # nada que desplegar. Se detecta aca y se salta el resto con una anotacion visible
      # en vez de fallar.
      - id: check_config
        name: Verificar variables de despliegue
        env:
          REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$REGION" ] || [ -z "$ROLE_ARN" ] || [ -z "$INSTANCE" ]; then
            echo "::notice title=Despliegue omitido::Faltan variables del Environment '${{ env.DEPLOY_ENV }}' (AWS_REGION/AWS_DEPLOY_ROLE_ARN/EC2_INSTANCE_ID). Configuralas en Settings -> Environments -> ${{ env.DEPLOY_ENV }} para habilitar el despliegue automatico. La imagen ${{ env.DEPLOY_TAG }} ya quedo publicada en GHCR."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.check_config.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Desplegar ${{ env.DEPLOY_TAG }} en ${{ env.DEPLOY_ENV }}
        if: steps.check_config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # El checkout de la VM sigue exactamente el commit que se despliega, para que
          # deploy/docker-compose.yml y los templates de nginx coincidan con la imagen.
          # Los .env y certificados estan en .gitignore, el checkout no los toca.
          # SSM ejecuta como root; git (dubious ownership), la deploy key y el login a GHCR
          # viven en el usuario $DEPLOY_USER (sin sudo, grupo docker), asi que root baja a ese
          # usuario para todo lo demas. @sh escapa las comillas simples de cada nivel.
          COMMANDS=$(jq -cn \
            --arg dir "$DEPLOY_DIR" --arg sha "$DEPLOY_SHA" \
            --arg env "$DEPLOY_ENV" --arg tag "$DEPLOY_TAG" \
            --arg user "$DEPLOY_USER" \
            '"set -euo pipefail; cd \($dir | @sh); git fetch --quiet --depth=1 origin \($sha | @sh); git checkout --quiet --force --detach FETCH_HEAD; deploy/scripts/deploy.sh \($env | @sh) \($tag | @sh)" as $inner
            | [
              "set -euo pipefail",
              "sudo -u \($user | @sh) -H bash -c \($inner | @sh)"
            ]')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ruta ${DEPLOY_ENV} ${DEPLOY_TAG} (run ${GITHUB_RUN_ID})" \
            --parameters "$(jq -cn --argjson c "$COMMANDS" '{commands: $c, executionTimeout: ["900"]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # "aws ssm wait command-executed" se rinde a los ~100 s; un despliegue con
          # pull + healthcheck puede tardar mas, asi que se hace polling propio (15 min).
          STATUS=Pending
          for _ in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          echo "Estado final: $STATUS"
          [ "$STATUS" = "Success" ]
