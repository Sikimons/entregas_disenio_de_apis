server:
  port: 8080
  # Al recibir SIGTERM (docker compose up con imagen nueva / down), deja de aceptar
  # conexiones y termina las peticiones en curso antes de apagarse (p. ej. una
  # confirmacion de entrega con foto a medio subir). Debe ser menor que el
  # stop_grace_period del servicio backend en deploy/docker-compose.yml.
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery_pin_middleware}
    username: ${DB_USERNAME:delivery_pin}
    password: ${DB_PASSWORD:delivery_pin}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Antes fijo en el valor por defecto (10); configurable para el escenario de carga
      # que busca el breakpoint de los endpoints de lectura ligeros (Fase8, load-tests/breakpoint.js).
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway es la unica fuente de verdad del esquema (Fase4); Hibernate solo valida
      # que las entidades coincidan con lo que las migraciones ya crearon.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    file: ${APP_SEED_FILE:file:/app/demo/invoices.json}
    # Solo para el servicio "seed" del compose (ver infrastructure.seed.Initializer):
    # siembra los datos de muestra y termina, en vez de dejar el backend real corriendo
    # en modo siembra.
    one-shot: ${APP_SEED_ONE_SHOT:false}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_super_secret_key_min_32_chars_long_please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:admin123}
  login-rate-limit:
    # Fuerza bruta contra /api/v1/auth/login (Seguridad, hallazgo Media pendiente).
    # Limite en memoria por IP+usuario; no requiere Redis para el tamano de este piloto.
    max-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:5}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  cost:
    # Tarifas del showback de costo por entrega (Fase1 §4.5). En 0 por defecto: el panel
    # sigue mostrando entregas confirmadas y GB de evidencia (datos reales del sistema)
    # aunque no se configuren estas tarifas externas.
    infra-monthly-usd: ${APP_COST_INFRA_MONTHLY_USD:0}
    storage-per-gb-usd: ${APP_COST_STORAGE_PER_GB_USD:0}
    support-hour-usd: ${APP_COST_SUPPORT_HOUR_USD:0}
  resilience:
    # Circuit Breaker "erpGateway" (protege LocalInvoiceAdapter, la simulacion del ERP
    # de Fase1 §3). Activado por defecto; se puede apagar para comparar el comportamiento.
    circuit-breaker-enabled: ${APP_CIRCUIT_BREAKER_ENABLED:true}
    failure-rate-threshold: ${APP_CIRCUIT_BREAKER_FAILURE_RATE:50}
    wait-duration-open-state-seconds: ${APP_CIRCUIT_BREAKER_WAIT_SECONDS:15}
    # Retry "erpGatewayRetry" (Fase8): solo lecturas de LocalInvoiceAdapter (ver protectedRead()).
    retry-enabled: ${APP_RETRY_ENABLED:true}
    retry-max-attempts: ${APP_RETRY_MAX_ATTEMPTS:3}
    retry-wait-duration-millis: ${APP_RETRY_WAIT_MILLIS:200}
  cache:
    # Cache Aside (Fase8): lineas de factura y ubicacion esperada no cambian tras crear
    # la factura, asi que se cachean en memoria (Caffeine) para no repetir la consulta.
    invoice-lines-ttl-seconds: ${APP_CACHE_INVOICE_LINES_TTL_SECONDS:300}
    expected-location-ttl-seconds: ${APP_CACHE_EXPECTED_LOCATION_TTL_SECONDS:300}
    max-entries: ${APP_CACHE_MAX_ENTRIES:2000}

logging:
  level:
    com.ruta.deliverypin: INFO
