server:
  port: 8080
  tomcat:
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB

spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery_pin_middleware}
    username: ${DB_USERNAME:delivery_pin}
    password: ${DB_PASSWORD:delivery_pin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    file: ${APP_DEMO_FILE:file:/app/demo/invoices.json}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_super_secret_key_min_32_chars_long_please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    com.ruta.deliverypin: INFO
