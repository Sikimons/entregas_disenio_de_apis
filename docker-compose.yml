services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery_pin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery_pin_middleware
      POSTGRES_USER: delivery_pin
      POSTGRES_PASSWORD: delivery_pin
    ports:
      - "5432:5432"
    volumes:
      - delivery_pin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_pin -d delivery_pin_middleware"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: delivery_pin_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dentro de docker-compose el backend habla con el postgres del propio stack
      # por nombre de servicio, no por localhost (esto pisa lo que diga backend/.env).
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: delivery_pin_middleware
      DB_USERNAME: delivery_pin
      DB_PASSWORD: delivery_pin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5180}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8091:8080"

  frontend:
    build:
      context: ./frontend
    container_name: delivery_pin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5180:80"

volumes:
  delivery_pin_pgdata:
