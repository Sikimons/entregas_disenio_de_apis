name: ${COMPOSE_PROJECT_NAME:-ruta-delivery}

# Unico compose del proyecto: sirve local, staging y produccion (antes habia un
# docker-compose.seed.yml aparte en la raiz, solo para desarrollo local, que duplicaba
# el servicio "seed" y buena parte del backend -- se unifico todo aqui). Los tres ejes de
# variacion se resuelven cada uno con la herramienta que le corresponde:
#   - entorno (local/staging/produccion): URLs, secretos, tags -> --env-file deploy/env/<entorno>.env
#   - topologia (¿postgres local? ¿frontend aqui?)             -> profiles ("db", "frontend", "seed")
#   - config de nginx segun topologia                          -> NGINX_SITE=api|full|local (envsubst)
#
# Uso tipico (staging/produccion):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/env/production.env up -d
#
# Escenario A (hoy, staging/produccion): backend en EC2 + AWS RDS PostgreSQL (DB_HOST =
# endpoint de RDS, DB_SSL_MODE=verify-full), frontend en Cloudflare Pages.
#   COMPOSE_PROFILES=            NGINX_SITE=api
#   (agrega "db" solo si quieres Postgres en contenedor en la VM en vez de RDS)
# Escenario B: todo en la misma VM detras del mismo nginx (Postgres en contenedor).
#   COMPOSE_PROFILES=db,frontend NGINX_SITE=full
# Local (desarrollo, ver deploy/env/local.env.example): todo en un solo host, sin TLS,
# construyendo las imagenes en vez de bajarlas de GHCR (backend/frontend/seed ya
# declaran "build:" ademas de "image:" para esto, ver mas abajo).
#   COMPOSE_PROFILES=db,frontend,seed NGINX_SITE=local
#   docker compose -f deploy/docker-compose.yml --env-file deploy/env/local.env up -d --build --wait
# Primer arranque con datos iniciales en cualquier entorno, incluida produccion real (solo
# UNA VEZ, nunca de forma continua -- sin ERP externo que alimente facturas nuevas, esas se
# crean desde el panel admin o scripts/generate_invoices.py, no reactivando este profile):
#   agregar "seed" al COMPOSE_PROFILES de arriba
#
# En la VM no se corre "up" a mano: deploy/scripts/deploy.sh (lo invoca CD) fija el tag
# de imagen, respalda la BD, espera los healthchecks y hace rollback si algo falla. El
# "build:" de mas abajo no lo usa ese flujo (siempre hace pull de una imagen ya publicada
# en GHCR), solo lo usa quien corre "up --build" a mano para desarrollo local.

# Rotacion de logs: el driver json-file por defecto no tiene limite y termina llenando
# el disco de la VM. 5 archivos x 10 MB por contenedor.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

# Ningun contenedor corre como root (cada uno declara su "user" o su imagen ya usa un
# usuario no privilegiado) y ninguno necesita capacidades de Linux: todos escuchan en
# puertos > 1024 y no hacen chown/setuid. no-new-privileges impide ganarlas via binarios
# setuid.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Sin root (nginx-unprivileged, uid 101): escucha en 8080/8443 dentro del contenedor y
  # se publica en 80/443. La clave de deploy/certs debe ser legible por el uid 101 (ver README).
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.30-alpine
    user: "101:101"
    restart: unless-stopped
    logging: *logging
    environment:
      SERVER_NAME: ${SERVER_NAME:?define SERVER_NAME en el .env del entorno}
    volumes:
      - ./nginx/templates/${NGINX_SITE:-api}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      # docs.htpasswd (Basic Auth de Swagger UI, ver snippets/api-docs.conf); ignorado por git.
      - ${SECRETS_DIR:-./secrets}:/etc/nginx/secrets:ro
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
        required: false
    healthcheck:
      # 127.0.0.1 y no "localhost": en alpine localhost resuelve primero a ::1 y los
      # templates solo escuchan en IPv4 ("listen 8080"), asi que el check fallaba siempre.
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Job de una sola pasada: siembra demo/invoices.json (facturas, PIN y el conductor de
  # muestra) y termina. Solo se activa con el profile "seed" (ver README); el
  # servicio "backend" de abajo siempre arranca con APP_SEED_ENABLED=false, para que el
  # guard de secretos (SecretsGuardRunner) este activo tambien en el primer arranque.
  seed:
    <<: *hardening
    profiles: [seed]
    image: ${BACKEND_IMAGE:-ruta-backend}:${BACKEND_TAG:-latest}
    user: "10001:10001"
    build: ../backend
    env_file:
      - ${APP_ENV_FILE:?define APP_ENV_FILE en el .env del entorno (ruta al mismo archivo pasado en --env-file)}
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      APP_SEED_ENABLED: "true"
      APP_SEED_ONE_SHOT: "true"
      APP_SEED_FILE: file:/app/demo/invoices.json
    volumes:
      - ../demo:/app/demo:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    logging: *logging

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-ruta-backend}:${BACKEND_TAG:-latest}
    user: "10001:10001"
    build: ../backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${APP_ENV_FILE:?define APP_ENV_FILE en el .env del entorno (ruta al mismo archivo pasado en --env-file)}
    environment:
      # DB_HOST/DB_PORT se interpolan desde el mismo .env del entorno (--env-file), asi
      # que valen lo que diga ese archivo: "postgres" (servicio del profile "db") o el
      # host de una BD externa (p. ej. RDS). El valor por defecto solo aplica si el .env
      # no los define.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      APP_SEED_ENABLED: "false"
      # La JVM dimensiona el heap segun el limite de memoria del contenedor (mem_limit)
      # en vez de la RAM de toda la VM, y ante un OutOfMemoryError termina (restart lo
      # levanta de nuevo) en vez de quedar vivo en un estado inconsistente.
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    # Mayor que spring.lifecycle.timeout-per-shutdown-phase (20s, application.yml) para
    # que el apagado ordenado termine las peticiones en curso antes del SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      seed:
        condition: service_completed_successfully
        required: false
    healthcheck:
      # readiness (no /actuator/health a secas): solo reporta UP cuando la app termino
      # de arrancar (Flyway incluido) y puede recibir trafico; durante el apagado
      # ordenado pasa a OUT_OF_SERVICE.
      test: [CMD-SHELL, "curl -sf http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  postgres:
    <<: *hardening
    profiles: [db]
    image: postgres:16-alpine
    # uid/gid "postgres" de la imagen alpine. El entrypoint oficial arranca sin root si ya
    # es ese usuario; el volumen (nuevo o creado antes por este mismo entrypoint) le pertenece.
    user: "70:70"
    restart: unless-stopped
    logging: *logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    # Da tiempo a postgres de hacer checkpoint y cerrar limpio (el default de 10s puede
    # cortar un checkpoint grande y forzar recovery en el siguiente arranque).
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${DB_NAME:-delivery_pin_middleware}
      POSTGRES_USER: ${DB_USERNAME:-delivery_pin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el .env del entorno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo loopback de la VM (para psql/tuneles SSM de mantenimiento); nunca 0.0.0.0.
    ports:
      - "${DB_PUBLIC_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USERNAME:-delivery_pin} -d ${DB_NAME:-delivery_pin_middleware}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Solo para el escenario B (todo en la misma VM detras de este nginx). En el
  # escenario A el frontend vive en Cloudflare Pages y este servicio no se activa.
  frontend:
    <<: *hardening
    profiles: [frontend]
    image: ${FRONTEND_IMAGE:-ruta-frontend}:${FRONTEND_TAG:-latest}
    user: "101:101"
    build: ../frontend
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-ruta-delivery}_pgdata
