# Certificado de origen de Cloudflare (Cloudflare dashboard -> SSL/TLS -> Origin Server
# -> Create Certificate). Guardar en deploy/certs/ (ignorado por git, ver .gitignore):
#   deploy/certs/origin.pem      (certificado)
#   deploy/certs/origin-key.pem  (clave privada)
# En Cloudflare, el modo SSL/TLS del dominio debe quedar en "Full (strict)": Cloudflare
# solo confia en este certificado (no en una CA publica) para hablar con el origen.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
