# Headers estandar de proxy inverso para el backend.
#
# X-Forwarded-For se REESCRIBE con $remote_addr (no se usa $proxy_add_x_forwarded_for,
# que ANEXA al valor entrante) a proposito: gracias a cloudflare-realip.conf,
# $remote_addr ya es la IP real del cliente en este punto, y AuthController
# (backend/src/main/java/.../AuthController.java) confia en el PRIMER valor de este
# header para el LoginRateLimiter. Anexar en vez de reescribir permitiria falsificar
# la IP simplemente enviando un X-Forwarded-For propio.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
