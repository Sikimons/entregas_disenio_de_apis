# Swagger UI + contrato OpenAPI del backend, solo con usuario/clave (Basic Auth).
# El backend los deja permitAll (SecurityConfig) porque solo es alcanzable a traves de
# este nginx; la puerta es esta. Fail-closed: si falta deploy/secrets/docs.htpasswd, nginx
# responde 401 en estas rutas (nadie entra) (el resto de /api/ y /healthz no se ve afectado).
# Crear el archivo (nginx corre como uid 101):
#   printf 'docs:%s\n' "$(openssl passwd -6 'CLAVE')" > deploy/secrets/docs.htpasswd
#   sudo chown 101:101 deploy/secrets/docs.htpasswd && sudo chmod 600 deploy/secrets/docs.htpasswd
# Sin add_header aqui a proposito: cualquiera dentro del location anularia el HSTS de tls.conf.
location ~ ^/(swagger-ui(/|\.html$)|v3/api-docs) {
    auth_basic "Ruta API docs";
    auth_basic_user_file /etc/nginx/secrets/docs.htpasswd;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://backend:8080;
}
