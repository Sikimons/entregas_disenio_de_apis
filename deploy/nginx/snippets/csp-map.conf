# CSP por ruta para el nginx del backend (se incluye a nivel http, fuera de "server"; el
# header se envia con "add_header Content-Security-Policy $api_csp always;" en cada server).
# Un map evita un add_header dentro de cada location: en nginx, un add_header en un
# location ANULA los del server que lo contiene (se perderia el HSTS de tls.conf).
# Un valor vacio hace que nginx no emita el header; asi las rutas que sirve el frontend
# (escenarios full/local) conservan solo el CSP del propio nginx del frontend
# (frontend/security-headers.conf), sin duplicarlo.
#
# - /api/**: respuestas JSON, nunca se renderizan; nada puede cargarse ni incrustarse.
# - Swagger UI y /v3/api-docs (ver api-docs.conf): swagger-ui carga sus scripts, hojas de
#   estilo y fuentes del mismo origen (webjar de springdoc); React inyecta atributos
#   style="" (por eso 'unsafe-inline' solo en style-src, nunca en script-src); iconos y
#   fuentes embebidos como data:; "Try it out" y /v3/api-docs son same-origin (connect-src).
#   Sin recursos externos: validator.swagger.io esta desactivado (springdoc.swagger-ui.
#   validator-url=none).
map $uri $api_csp {
    default "";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    ~^/(swagger-ui|v3/api-docs) "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}
