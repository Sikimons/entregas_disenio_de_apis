# Cabeceras de seguridad del frontend (docs/EVALUACION_TECNICA.md §18, N5). Snippet aparte
# (no directo en nginx.conf) porque un "add_header" dentro de un "location" ANULA los del
# bloque "server" que lo contiene -- sin este include repetido, /sw.js y
# /manifest.webmanifest (que ya traen su propio add_header Cache-Control) se quedarian sin
# ninguna de estas cabeceras.
#
# Acotado a lo que la app realmente necesita, no a una plantilla generica de "hardening":
#   - GPS del conductor y camara -> Permissions-Policy los deja abiertos solo para "self".
#   - OCR de facturas (tesseract.js) -> corre en un Worker cargado como blob: y usa WebAssembly.
#   - Fotos de evidencia (URL.createObjectURL) -> imagenes blob:.
#   - leaflet.css embebe iconos como data:, y la compresion de imagenes del conductor
#     (FileReader) tambien produce data: URIs.
#   - Google Fonts: unica dependencia externa real del frontend.
#   - Teselas del mapa y llamadas a la API son same-origin en este nginx (proxies /map-tiles/
#     y /api/), asi que "'self'" les alcanza aqui. frontend/public/_headers (Cloudflare
#     Pages) NO tiene esos proxies y por eso su CSP difiere en img-src/connect-src.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# strict-origin-when-cross-origin (no no-referrer): las teselas de OpenStreetMap exigen un
# Referer valido segun su politica de uso.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
