server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # API -> backend (nombre del servicio en docker-compose)
    location /api/ {
        client_max_body_size 15M;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For se REESCRIBE con $remote_addr (no $proxy_add_x_forwarded_for, que
        # ANEXA al valor entrante): AuthController confia en el PRIMER valor de este header
        # para LoginRateLimiter, y anexar en vez de reescribir permitiria falsificar la IP
        # enviando un X-Forwarded-For propio (mismo criterio que
        # deploy/nginx/snippets/proxy-headers.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy same-origin para los tiles del mapa: algunas redes moviles/corporativas
    # bloquean CDNs de terceros directo desde el navegador del conductor.
    location /map-tiles/ {
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "RutaDelivery/1.0 (local delivery application)";
        proxy_set_header Referer $http_referer;
        proxy_set_header Accept-Encoding "";
        proxy_pass https://tile.openstreetmap.org/;
    }

    # No cachear el service worker ni el manifest de la PWA. Repiten el include: un
    # "add_header" dentro de un location anula los del server que lo contiene, asi que sin
    # esto estas dos respuestas se quedarian sin las cabeceras de seguridad de arriba.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
