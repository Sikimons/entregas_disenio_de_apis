server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (nombre del servicio en docker-compose)
    location /api/ {
        client_max_body_size 15M;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy same-origin para los tiles del mapa: algunas redes moviles/corporativas
    # bloquean CDNs de terceros directo desde el navegador del conductor.
    location /map-tiles/ {
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "RutaDelivery/1.0 (local delivery application)";
        proxy_set_header Referer $http_referer;
        proxy_set_header Accept-Encoding "";
        proxy_pass https://tile.openstreetmap.org/;
    }

    # No cachear el service worker ni el manifest de la PWA
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
